AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Papa's Choice registration emails and private temporary document uploads

Parameters:
  FromEmail:
    Type: String
    Description: An email address verified in SES in this region
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
  RecipientEmail:
    Type: String
    Default: imfahim003@gmail.com
    Description: Server controlled destination for all registration emails
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact website origin without a trailing slash or path
    AllowedPattern: '^(https://[^/]+|http://localhost:[0-9]+|http://127\.0\.0\.1:[0-9]+)$'

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - POST
            AllowedHeaders:
              - '*'
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTemporaryDocuments
            Status: Enabled
            Prefix: registrations/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub '${UploadBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  RegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Timeout: 25
      MemorySize: 512
      Environment:
        Variables:
          FROM_EMAIL: !Ref FromEmail
          TO_EMAIL: !Ref RecipientEmail
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          UPLOAD_BUCKET: !Ref UploadBucket
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref FromEmail
                ForAllValues:StringEquals:
                  ses:Recipients:
                    - !Ref RecipientEmail
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub '${UploadBucket.Arn}/registrations/*'
      FunctionUrlConfig:
        AuthType: NONE

  RegistrationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RegistrationFunction}'
      RetentionInDays: 14

Outputs:
  RegistrationApiUrl:
    Description: Set VITE_REGISTRATION_API_URL to this value in apps/web/.env.local
    Value: !GetAtt RegistrationFunctionUrl.FunctionUrl
  RegistrationFunctionName:
    Value: !Ref RegistrationFunction
  UploadBucketName:
    Value: !Ref UploadBucket
